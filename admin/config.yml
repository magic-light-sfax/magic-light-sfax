backend:
  name: github
  repo: magic-light-sfax/magic-light-sfax
  branch: main

site_url: https://magic-light-sfax.netlify.app
display_url: https://magic-light-sfax.netlify.app
logo_url: https://magic-light-sfax.netlify.app/assets/logo.jpg

media_folder: "assets/products"
public_folder: "/assets/products"

publish_mode: simple
locale: "fr"

collections:
  - name: "products"
    label: "Produits"
    label_singular: "Produit"
    folder: "content/products"
    create: true
    extension: "json"
    format: "json"
    identifier_field: "reference"
    slug: "{{slug}}"
    summary: "{{reference}} — {{name}}"
    sortable_fields: ["name", "reference", "category"]
    fields:
      - {label: "Nom du produit", name: "name", widget: "string"}
      - {label: "Référence", name: "reference", widget: "string", hint: "Exemple: ML-001"}
      - {label: "Catégorie", name: "category", widget: "string", hint: "Ex: Lustres & suspensions, Spots LED, Solaire, RGB..."}
      - {label: "Description", name: "description", widget: "text", required: false}
      - {label: "Prix", name: "price", widget: "number", value_type: "float", min: 0, required: false, hint: "Prix normal de l’article. Laissez vide si vous ne voulez pas afficher le prix."}
      - {label: "En promotion", name: "promo", widget: "boolean", default: false, required: false, hint: "Activez uniquement pour les articles en remise."}
      - {label: "Remise (%)", name: "discount", widget: "number", value_type: "float", min: 0, max: 90, default: 0, required: false, hint: "Exemple : 25 ou 40. Le site calcule automatiquement le prix promo."}
      - {label: "Photo", name: "image", widget: "image"}
      - {label: "Nouveauté", name: "featured", widget: "boolean", default: true}
      - {label: "Afficher sur le site", name: "active", widget: "boolean", default: true}

  - name: "bulk_import"
    label: "Import Excel / CSV"
    format: "json"
    editor:
      preview: false
    files:
      - label: "Importer des produits en masse"
        name: "products_import"
        file: "content/imports/products-import.json"
        fields:
          - {label: "Activer cet import", name: "enabled", widget: "boolean", default: false, required: false, hint: "Activez après avoir choisi le fichier. Désactivez pour revenir uniquement aux fiches Produits individuelles."}
          - label: "Fichier Excel / CSV"
            name: "file"
            widget: "file"
            required: false
            allow_multiple: false
            media_folder: "assets/imports"
            public_folder: "/assets/imports"
            hint: "Formats acceptés : .xlsx, .xls ou .csv. Utilisez la première feuille du classeur. Modèle : /admin/template-produits.csv"
          - {label: "Note interne", name: "note", widget: "text", required: false, hint: "Facultatif. Cette note n’apparaît pas sur le site."}
