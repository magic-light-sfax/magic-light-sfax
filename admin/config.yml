backend:
  name: github
  repo: magic-light-sfax/magic-light-sfax
  branch: main

site_url: https://magic-light-sfax.netlify.app
display_url: https://magic-light-sfax.netlify.app
logo_url: https://magic-light-sfax.netlify.app/assets/logo.jpg

media_folder: "assets/products"
public_folder: "/assets/products"

publish_mode: simple
locale: "fr"

collections:
  - name: "products"
    label: "Produits"
    label_singular: "Produit"
    folder: "content/products"
    create: true
    extension: "json"
    format: "json"
    identifier_field: "reference"
    slug: "{{slug}}"
    summary: "{{reference}} — {{name}}"
    sortable_fields: ["name", "reference", "category"]
    fields:
      - {label: "Nom du produit", name: "name", widget: "string"}
      - {label: "Référence", name: "reference", widget: "string", hint: "Exemple: ML-001"}
      - {label: "Catégorie", name: "category", widget: "string", hint: "Ex: Lustres & suspensions, Spots LED, Solaire, RGB..."}
      - {label: "Description", name: "description", widget: "text", required: false}
      - {label: "Prix", name: "price", widget: "number", value_type: "float", min: 0, required: false, hint: "Prix normal de l’article. Laissez vide si vous ne voulez pas afficher le prix ou si chaque variante a son propre prix."}
      - {label: "En promotion", name: "promo", widget: "boolean", default: false, required: false, hint: "Activez uniquement pour les articles en remise."}
      - {label: "Remise (%)", name: "discount", widget: "number", value_type: "float", min: 0, max: 90, default: 0, required: false, hint: "Exemple : 25 ou 40. La remise s’applique aussi au prix de la variante sélectionnée."}
      - {label: "Photo principale", name: "image", widget: "image"}
      - label: "Galerie photos"
        name: "images"
        widget: "list"
        required: false
        hint: "Ajoutez 2, 3 images ou plus. Elles apparaissent en miniatures dans la fiche produit."
        field: {label: "Photo", name: "image", widget: "image"}
      - label: "Images 360°"
        name: "spin360"
        widget: "list"
        required: false
        hint: "Séquence de photos prises autour du produit dans le même ordre. 12 à 36 images donnent un meilleur résultat."
        field: {label: "Image 360", name: "image", widget: "image"}
      - {label: "Puissance / Watt", name: "watt", widget: "string", required: false, hint: "Ex: 18W. Pour plusieurs puissances ou prix différents, utilisez Variantes ci-dessous."}
      - {label: "Dimensions", name: "dimensions", widget: "string", required: false, hint: "Ex: 40 x 40 cm. Pour une dimension différente par variante, utilisez Dimensions de cette variante."}

      - label: "Couleurs disponibles — même prix"
        name: "colors"
        widget: "list"
        required: false
        hint: "Raccourci pour les couleurs du produit quand elles gardent le même prix. Ajoutez uniquement les couleurs réellement disponibles pour cet article."
        field: {label: "Couleur", name: "color", widget: "string"}

      - label: "Autres options disponibles — même prix"
        name: "options"
        widget: "list"
        required: false
        collapsed: true
        hint: "Pour les choix qui ne changent pas le prix : Couleur d’éclairage, Intensité, Longueur, Pack, finition, etc. Vous choisissez librement le nom de l’option et ses valeurs."
        summary: "{{fields.name}}"
        fields:
          - {label: "Nom de l’option", name: "name", widget: "string", hint: "Ex: Couleur d’éclairage, Intensité, Longueur, Pack..."}
          - label: "Valeurs disponibles"
            name: "values"
            widget: "list"
            required: false
            field: {label: "Valeur", name: "value", widget: "string", hint: "Ex: 3000K, 4000K, 6500K"}

      - label: "Variantes — prix / stock / référence / options"
        name: "variants"
        widget: "list"
        required: false
        collapsed: true
        hint: "Utilisez une variante quand le prix, la référence, le stock, la photo ou la dimension change selon le choix. Watt et Couleur restent disponibles en raccourci. Pour tout autre choix, utilisez Options supplémentaires de cette variante."
        summary: "{{fields.watt}} {{fields.color}} — {{fields.price}} TND"
        fields:
          - {label: "Puissance / Watt", name: "watt", widget: "string", required: false, hint: "Ex: 6W, 12W, 18W. Laissez vide si cette variante ne dépend pas du Watt."}
          - {label: "Couleur", name: "color", widget: "string", required: false, hint: "Ex: Noir, Blanc, Gold, Gris. Laissez vide si cette variante ne dépend pas de la couleur."}
          - label: "Options supplémentaires de cette variante"
            name: "attributes"
            widget: "list"
            required: false
            collapsed: true
            hint: "Pour toute autre caractéristique qui sert de choix client : CCT, Intensité, Longueur, Diamètre, Pack, finition, etc."
            summary: "{{fields.name}}: {{fields.value}}"
            fields:
              - {label: "Nom de l’option", name: "name", widget: "string", hint: "Ex: Intensité"}
              - {label: "Valeur", name: "value", widget: "string", hint: "Ex: 16A"}
          - {label: "Prix de cette variante", name: "price", widget: "number", value_type: "float", min: 0, required: false, hint: "Si vide, le prix général de l’article est utilisé."}
          - {label: "Dimensions de cette variante", name: "dimensions", widget: "string", required: false, hint: "Ex: 7.5 cm, 12.5 cm, 16.5 cm. La dimension affichée change automatiquement avec la variante."}
          - {label: "Référence variante", name: "reference", widget: "string", required: false, hint: "Optionnel. Utilisez la référence réelle si elle existe."}
          - {label: "Photo de la variante", name: "image", widget: "image", required: false, hint: "Optionnel. Si renseignée, la photo change quand le client choisit cette variante."}
          - {label: "Quantité en stock variante", name: "stockQty", widget: "number", value_type: "int", min: 0, required: false, hint: "Optionnel. 0 = rupture de stock pour cette variante."}
          - {label: "Texte disponibilité variante", name: "stock", widget: "string", required: false, hint: "Ex: Sur commande, Disponible sous 48h."}
          - {label: "Variante disponible", name: "active", widget: "boolean", default: true, required: false}

      - {label: "Quantité en stock", name: "stockQty", widget: "number", value_type: "int", min: 0, required: false, hint: "Quantité physique disponible. Laissez vide si le stock n'est pas suivi pour cet article."}
      - {label: "Alerte stock faible", name: "stockAlert", widget: "number", value_type: "int", min: 0, default: 3, required: false, hint: "Ex: 3 = afficher Stock faible à partir de 3 pièces restantes."}
      - {label: "Texte disponibilité", name: "stock", widget: "string", required: false, hint: "Optionnel si aucune quantité n'est saisie. Ex: Sur commande, Nous contacter."}
      - {label: "Nouveauté", name: "featured", widget: "boolean", default: true}
      - {label: "Afficher sur le site", name: "active", widget: "boolean", default: true}

  - name: "bulk_import"
    label: "Import Excel / CSV"
    format: "json"
    editor:
      preview: false
    files:
      - label: "Importer des produits en masse"
        name: "products_import"
        file: "content/imports/products-import.json"
        fields:
          - {label: "Activer cet import", name: "enabled", widget: "boolean", default: false, required: false, hint: "Activez après avoir choisi le fichier. Désactivez pour revenir uniquement aux fiches Produits individuelles."}
          - label: "Fichier Excel / CSV"
            name: "file"
            widget: "file"
            required: false
            allow_multiple: false
            media_folder: "/assets/imports"
            public_folder: "/assets/imports"
            hint: "Formats acceptés : .xlsx, .xls ou .csv. Utilisez la première feuille du classeur. Modèle : /admin/template-produits.csv"
          - {label: "Note interne", name: "note", widget: "text", required: false, hint: "Facultatif. Cette note n’apparaît pas sur le site."}

  - name: "analytics_settings"
    label: "Analytics & Meta Pixel"
    format: "json"
    editor:
      preview: false
    files:
      - label: "Suivi des visiteurs et conversions"
        name: "analytics"
        file: "content/settings/analytics.json"
        fields:
          - {label: "Activer Google Analytics 4", name: "ga4Enabled", widget: "boolean", default: false, required: false}
          - {label: "GA4 Measurement ID", name: "ga4MeasurementId", widget: "string", required: false, hint: "Exemple : G-XXXXXXXXXX"}
          - {label: "Activer Meta Pixel", name: "metaEnabled", widget: "boolean", default: false, required: false}
          - {label: "Meta Pixel ID", name: "metaPixelId", widget: "string", required: false, hint: "Suite de chiffres fournie par Meta Events Manager"}
          - {label: "Note", name: "note", widget: "text", required: false, hint: "Optionnel. Aucun nom, téléphone, e-mail ou adresse client n’est envoyé aux outils Analytics."}
